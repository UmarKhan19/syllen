[package]
name = "yt-transcript"
version = "0.1.0"
description = "Local YouTube transcription with speaker labels"
authors = ["Umar Khan"]
edition = "2024"

[lib]
name = "yt_transcript_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http-range = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["default-tls", "charset"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
